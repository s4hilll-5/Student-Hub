# StudentHub backend configuration.
# Every secret comes from an environment variable (or backend/.env during local development).
# Nothing in this file is a real credential.

spring:
  application:
    name: studenthub
  config:
    # Loads backend/.env (KEY=value lines) when it exists. Real environment variables win.
    import: optional:file:.env[.properties]

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/studenthub?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}
    username: ${DB_USERNAME:studenthub_app}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}

  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema. Hibernate only checks that entities match it.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        type:
          # Store java.time.Instant in DATETIME(6) columns, always in UTC.
          preferred_instant_jdbc_type: TIMESTAMP

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    web:
      pageable:
        max-page-size: 100
        default-page-size: 10

  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: always

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_STARTTLS:true}
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

server:
  port: ${PORT:8080}
  # Set to "framework" when running behind a reverse proxy (Render, Railway, Nginx)
  # so the client IP used for rate limiting comes from X-Forwarded-For.
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  health:
    mail:
      enabled: false

app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  jwt:
    # Base64-encoded secret, at least 32 bytes. Generate: openssl rand -base64 64
    secret: ${JWT_SECRET}
    issuer: studenthub
    access-token-ttl: ${JWT_ACCESS_TTL:15m}
    refresh-token-ttl: ${JWT_REFRESH_TTL:7d}
    # Concurrent refreshes (two tabs) inside this window are not treated as token theft.
    refresh-reuse-grace: 20s
  cookie:
    # Keep true in production (HTTPS). Set COOKIE_SECURE=false only for local HTTP development.
    secure: ${COOKIE_SECURE:true}
    same-site: Strict
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  security:
    bcrypt-strength: ${BCRYPT_STRENGTH:12}
  password-reset:
    token-ttl: 30m
  mail:
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:StudentHub <no-reply@studenthub.local>}
  admin:
    # Optional: creates an ADMIN account on startup if both are set and the email is unused.
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}

logging:
  level:
    root: INFO
    com.studenthub: INFO
    org.hibernate.SQL: WARN
