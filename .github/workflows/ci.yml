name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Tests use an in-memory H2 database (profile "test"), so no MySQL service is needed.
      - run: mvn -B verify

  database:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-root
          MYSQL_DATABASE: studenthub
        ports: ["3306:3306"]
        options: --health-cmd="mysqladmin ping -pci-root" --health-interval=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - name: Apply the Flyway migration to real MySQL
        run: mysql -h 127.0.0.1 -uroot -pci-root studenthub < backend/src/main/resources/db/migration/V1__create_schema.sql

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
